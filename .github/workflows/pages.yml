name: Deploy MoonBit demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MOONBIT_INSTALL_VERSION: 0.10.12+1634b282e
      NEXT_PUBLIC_BASE_PATH: /investing-clarity-moonbit
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install pinned MoonBit
        shell: bash
        run: |
          curl --fail --location https://cli.moonbitlang.com/install/unix.sh -o "$RUNNER_TEMP/moonbit-install.sh"
          bash "$RUNNER_TEMP/moonbit-install.sh"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - run: pnpm run check
      - run: pnpm run lint
      - run: pnpm test
      - run: pnpm run build:web
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
